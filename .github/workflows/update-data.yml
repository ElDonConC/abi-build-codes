name: Monitor de fuentes

on:
  schedule:
    - cron: "0 6 * * *"   # cada día 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-fuentes
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar fuentes y revalidar códigos
        id: monitor
        run: python scripts/monitor.py

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor.json
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar"
            exit 0
          fi
          git commit -m "monitor: comprobación de fuentes $(date -u +%F)"
          git push
