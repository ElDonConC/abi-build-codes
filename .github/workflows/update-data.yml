name: Monitor de fuentes

on:
  schedule:
    - cron: "0 6 * * *"   # cada día 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-fuentes
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar fuentes y revalidar códigos
        id: monitor
        run: python scripts/monitor.py

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor.json
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar"
            exit 0
          fi
          git commit -m "monitor: comprobación de fuentes $(date -u +%F)"
          git push

      - name: Avisar por Discord (opcional)
        if: steps.monitor.outputs.changed == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Secret DISCORD_WEBHOOK no configurado; se omite el aviso"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          m = json.load(open("data/monitor.json"))
          r = m["resumen"]
          lineas = [
              f"📡 **Monitor ABI** — {m['updated_at'][:10]}",
              (f"Fuentes OK {r['fuentes_ok']}/{r['fuentes_total']} · "
               f"códigos presentes **{r['codigos_presentes']}** · "
               f"hoy no aparecen {r['codigos_ausentes']}"),
          ]
          if r.get("candidatos_nuevos"):
              cands = ", ".join(f"`{c['codigo']}`" for c in m["candidatos"][:8])
              lineas.append(f"🆕 {r['candidatos_nuevos']} códigos candidatos nuevos: {cands}")
          lineas.append("https://eldonconc.github.io/abi-build-codes/#fuentes")
          req = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=json.dumps({"content": "\n".join(lineas)}).encode(),
              headers={"Content-Type": "application/json"},
          )
          urllib.request.urlopen(req, timeout=15)
          print("Aviso enviado al canal")
          PY
