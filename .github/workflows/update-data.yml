name: Despliegue de ABI Armory

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # cada día 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Comprobar fuentes y revalidar códigos
        id: monitor
        run: python scripts/monitor.py

      - name: Incorporar candidatos a la base de datos
        run: python scripts/merge_candidates.py

      - name: Publicar cambios de datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor.json data/builds.json data/armas.json
          if ! git diff --cached --quiet; then
            git commit -m "data: actualización automática de monitor y builds $(date -u +%F)"
            git push
          else
            echo "Sin cambios de datos que commitear"
          fi

      - name: Instalar dependencias web
        run: npm ci

      - name: Sincronizar datos a carpeta public
        run: mkdir -p public && cp -r data public/

      - name: Compilar aplicación React
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
